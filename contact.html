  <script>
  /* Set the theme before first paint so a stored choice cannot flash
     the wrong palette; script.js repeats this later for the toggle. */
  try {
    var t = localStorage.getItem("theme");
    if (t !== "dark" && t !== "light")
      t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    document.documentElement.dataset.theme = t;
  } catch (e) {}
  </script>
  <link rel="stylesheet" href="style.css">
</head>
